name: Generate GitHub Stats Cards
on:
  workflow_dispatch:
  schedule:
    - cron: '0 */36 * * *' 

jobs:
  update-cards:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    name: Update cards
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure output folder
        run: mkdir -p profile

      # 1. 深色统计卡片 (Apple Dark: 纯白标题/图标，银灰文本)
      - name: Generate dark stats card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: stats
          options: 'username=${{ github.repository_owner }}&show_icons=true&hide_border=true&bg_color=00000000&title_color=ffffff&text_color=9ca3af&icon_color=ffffff&count_private=true'
          path: profile/stats-dark.svg
          token: ${{ secrets.PAT }} 

      # 2. 浅色统计卡片 (Apple Light: 纯黑标题/图标，深灰文本)
      - name: Generate light stats card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: stats
          options: 'username=${{ github.repository_owner }}&show_icons=true&hide_border=true&bg_color=00000000&title_color=000000&text_color=1d1d1f&icon_color=000000&count_private=true'
          path: profile/stats-light.svg
          token: ${{ secrets.PAT }}

      # 3. 深色语言卡片 
      - name: Generate dark top langs card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: top-langs
          options: 'username=${{ github.repository_owner }}&layout=compact&hide_border=true&bg_color=00000000&title_color=ffffff&text_color=9ca3af'
          path: profile/top-langs-dark.svg
          token: ${{ secrets.PAT }}

      # 4. 浅色语言卡片
      - name: Generate light top langs card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: top-langs
          options: 'username=${{ github.repository_owner }}&layout=compact&hide_border=true&bg_color=00000000&title_color=000000&text_color=1d1d1f'
          path: profile/top-langs-light.svg
          token: ${{ secrets.PAT }}

      # 5. 连击 (Streak) 卡片 (深空灰质感)
      - name: Generate streak stats
        uses: DenverCoder1/github-readme-streak-stats@main
        with:
          options: 'user=${{ github.repository_owner }}&hide_border=true&background=00000000&ring=ffffff&fire=ffffff&currStreakNum=ffffff&currStreakLabel=9ca3af&sideNums=ffffff&sideLabels=9ca3af&dates=9ca3af&disable_animations=true'
          path: profile/streak.svg
          token: ${{ secrets.PAT }} 

      # 6. 贪吃蛇 (Snake)
      - name: Generate snake animation
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            profile/github-contribution-grid-snake.svg
            profile/github-contribution-grid-snake-dark.svg?palette=github-dark
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 7. 统一提交
      - name: Commit all cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Update README cards for Apple style" || exit 0
          git push
