name: Generate GitHub Stats Cards
on:
  workflow_dispatch:
  schedule:
    - cron: '0 */36 * * *' # 每 36 小时自动更新一次

jobs:
  update-cards:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    name: Update cards
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure output folder
        run: mkdir -p profile

      # 1. 生成深色 GitHub 统计卡片
      - name: Generate dark stats card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: stats
          options: 'username=${{ github.repository_owner }}&show_icons=true&theme=tokyonight&hide_border=true&bg_color=00000000&title_color=00eaff&icon_color=ff00ff&count_private=true'
          path: profile/stats-dark.svg
          token: ${{ secrets.PAT }} 

      # 2. 生成浅色 GitHub 统计卡片
      - name: Generate light stats card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: stats
          options: 'username=${{ github.repository_owner }}&show_icons=true&hide_border=true&count_private=true'
          path: profile/stats-light.svg
          token: ${{ secrets.PAT }}

      # 3. 生成深色语言卡片
      - name: Generate dark top langs card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: top-langs
          options: 'username=${{ github.repository_owner }}&layout=compact&theme=tokyonight&hide_border=true&bg_color=00000000&title_color=ff00ff'
          path: profile/top-langs-dark.svg
          token: ${{ secrets.PAT }}

      # 4. 生成浅色语言卡片
      - name: Generate light top langs card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: top-langs
          options: 'username=${{ github.repository_owner }}&layout=compact&hide_border=true'
          path: profile/top-langs-light.svg
          token: ${{ secrets.PAT }}

      # 5. 生成连击 (Streak) 卡片 (已加入赛博朋克样式)
      - name: Generate streak stats
        uses: DenverCoder1/github-readme-streak-stats@main
        with:
          options: 'user=${{ github.repository_owner }}&theme=tokyonight&hide_border=true&background=00000000&ring=00eaff&fire=ff00ff&currStreakLabel=00eaff&disable_animations=true'
          path: profile/streak.svg
          token: ${{ secrets.PAT }} # 统一使用你的 PAT，确保获取数据的权限一致

      # 6. 统一提交所有生成的 SVG 图片
      - name: Commit all cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Update README cards including streak" || exit 0
          git push
