name: Generate GitHub Stats Cards
on:
  schedule:
    - cron: "0 0 * * *" # 每天午夜 UTC 时间运行一次自动更新
  workflow_dispatch:    # 允许你在网页端 Actions 界面手动点击运行

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # 1. 生成深色 GitHub 统计卡片 (对应 ./profile/stats-dark.svg)
      - name: Generate dark stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: 'username=${{ github.repository_owner }}&show_icons=true&theme=tokyonight&hide_border=true&bg_color=00000000&title_color=00eaff&icon_color=ff00ff&count_private=true'
          path: profile/stats-dark.svg
          token: ${{ secrets.PAT }} 

      # 2. 生成浅色 GitHub 统计卡片 (对应 ./profile/stats-light.svg)
      - name: Generate light stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: 'username=${{ github.repository_owner }}&show_icons=true&hide_border=true&count_private=true'
          path: profile/stats-light.svg
          token: ${{ secrets.PAT }}

      # 3. 生成深色语言卡片 (对应 ./profile/top-langs-dark.svg)
      - name: Generate dark top langs card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: 'username=${{ github.repository_owner }}&layout=compact&theme=tokyonight&hide_border=true&bg_color=00000000&title_color=ff00ff'
          path: profile/top-langs-dark.svg
          token: ${{ secrets.PAT }}

      # 4. 生成浅色语言卡片 (对应 ./profile/top-langs-light.svg)
      - name: Generate light top langs card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: 'username=${{ github.repository_owner }}&layout=compact&hide_border=true'
          path: profile/top-langs-light.svg
          token: ${{ secrets.PAT }}
